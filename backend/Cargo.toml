[package]
name = "skiplagging"
version = "0.2.0"
edition = "2021"
description = "Hidden-city fare discovery. Shop only — never creates a PNR."
rust-version = "1.85"

[dependencies]
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "chrono", "json", "macros"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
moka = { version = "0.12", features = ["sync"] }
regex = "1"
unicode-normalization = "0.1"
base64 = "0.22"
csv = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
urlencoding = "2"

[[bin]]
name = "api"
path = "src/main.rs"

[[bin]]
name = "ingest"
path = "src/bin/ingest.rs"

[[bin]]
name = "discover"
path = "src/bin/discover.rs"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-native-tls", "postgres", "chrono", "json"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.8", features = ["json"] }
tokio = { version = "1", features = ["full"] }
