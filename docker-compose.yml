services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: skiplagging
      POSTGRES_USER: skiplag
      POSTGRES_PASSWORD: skiplag
    ports:
      - "5432:5432"
    volumes:
      - skiplag_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skiplag -d skiplagging"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql://skiplag:skiplag@db:5432/skiplagging
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      DUFFEL_TOKEN: ${DUFFEL_TOKEN:-}
      MOCK_ENABLED: ${MOCK_ENABLED:-false}
      RAPIDAPI_KEY: ${RAPIDAPI_KEY:-}
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

  web:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    environment:
      API_PROXY: http://api:8000
    depends_on:
      - api

volumes:
  skiplag_pg:
