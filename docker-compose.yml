services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: skiplagging
      POSTGRES_USER: skiplag
      POSTGRES_PASSWORD: skiplag
    ports:
      - "5432:5432"
    volumes:
      - skiplag_pg:/var/lib/postgresql/data

  api:
    image: python:3.12-slim
    working_dir: /app/backend
    volumes:
      - ./:/app
    command: >
      sh -c "pip install -q -r requirements.txt &&
             python -m app.db.ingest &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://skiplag:skiplag@db:5432/skiplagging
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      - db

  web:
    image: node:22-alpine
    working_dir: /app/frontend
    volumes:
      - ./:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  skiplag_pg:
